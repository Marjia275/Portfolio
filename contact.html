<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Portfolio - Contact</title>
    <link rel="stylesheet" href="style-contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="container">

        <nav>
            <div class="logo">M</div>
            <ul>
                <li><a href="index.html" class="btn-link">Home</a></li>
                <li><a class="active" href="contact.html">Contact Me</a></li>
            </ul>
        </nav>

        <div class="contact-wrapper">

            <div class="contact-box">

                <h1>Get In Touch</h1>
                <p class="subtitle">
                    Feel free to reach out.
                </p>

                <div class="info-list">

                    <div class="info-item">
                        <div class="info-icon">
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                        <div class="info-text">
                            <h3>Email</h3>
                            <p>marjiya1997@gmail.com</p>
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="info-icon">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>
                        <div class="info-text">
                            <h3>Location</h3>
                            <p>Maulvibazar, Sylhet</p>
                        </div>
                    </div>

                </div>

                <hr class="line">

                <h2>Connect With Me</h2>

                <div class="social-links">
                    <a href="https://github.com/Marjia275" class="social-btn" target="_blank">
                        <i class="fa-brands fa-github"></i> GitHub
                    </a>
                    <a href="https://www.instagram.com/m_rj_y_/" class="social-btn" target="_blank">
                        <i class="fa-brands fa-instagram"></i> Instagram
                    </a>
                    <a href="https://www.facebook.com/marjiya.chy.6" class="social-btn" target="_blank">
                        <i class="fa-brands fa-facebook"></i> Facebook
                    </a>
                </div>

            </div>

            <div class="contact-form-box">

                <h1 class="form-title">Contact <span>Me</span></h1>

                <form class="contact-form">
                    <input type="text" placeholder="Your Name" required>
                    <input type="email" placeholder="E-mail" required>
                    <input type="text" placeholder="Write a Subject" required>
                    <textarea placeholder="Your Message" required></textarea>

                    <button type="submit" class="submit-btn">SUBMIT</button>
                </form>

            </div>

        </div>

    </div>

</body>

</html>
